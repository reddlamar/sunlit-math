name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Unit tests
        run: npm run test:coverage -- --ci

  eas-build-check:
    # Verifies the app config and native dependencies are healthy and that the iOS
    # JS bundle builds, without queuing (or paying for) a real EAS build.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Expo Doctor
        # expo-doctor's schema check only accepts image files for ios.icon, so it
        # wrongly rejects the Icon Composer bundle (assets/SunlitMath.icon) that Expo
        # prebuild supports. Tolerate exactly that one finding; any other failure fails.
        run: |
          npx expo-doctor 2>&1 | tee "$RUNNER_TEMP/doctor.log" || true
          if grep -E '^ Field: ' "$RUNNER_TEMP/doctor.log" | grep -qv "ios.icon - cannot access file at './assets/SunlitMath.icon'"; then
            echo "::error::Unexpected Expo config schema error"; exit 1
          fi
          failed=$(grep -c '^✖' "$RUNNER_TEMP/doctor.log" || true)
          if grep -q "^✖ Check Expo config" "$RUNNER_TEMP/doctor.log"; then failed=$((failed - 1)); fi
          [ "$failed" -eq 0 ]
      - name: Bundle iOS
        run: npx expo export --platform ios --output-dir "$RUNNER_TEMP/export"
